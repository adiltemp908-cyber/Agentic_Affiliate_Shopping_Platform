[project]
name = "shortlist-local"
version = "0.2.0"
description = "Local, evidence-based multi-retailer shopping research"
requires-python = ">=3.11"
dependencies = ["requests==2.32.5", "beautifulsoup4==4.12.3", "numpy==2.1.3", "pydantic==2.10.3", "langchain-core==1.1.0", "langgraph==1.0.4", "langgraph-checkpoint-sqlite>=3,<4", "sentence-transformers==5.1.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shortlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=data/pytest-tmp"

